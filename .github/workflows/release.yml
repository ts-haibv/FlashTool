name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: FlashTool-Linux
            asset_name: FlashTool-Linux
          - os: windows-latest
            artifact_name: FlashTool-Windows
            asset_name: FlashTool-Windows.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable build
        run: |
          pyinstaller FlashTool.spec

      - name: Rename Executable (Linux)
        if: runner.os == 'Linux'
        run: |
          mv dist/FlashTool dist/${{ matrix.asset_name }}

      - name: Rename Executable (Windows)
        if: runner.os == 'Windows'
        run: |
          move dist\FlashTool.exe dist\${{ matrix.asset_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: FlashTool-Linux
          path: dist/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: FlashTool-Windows
          path: dist/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FlashTool-Linux
            dist/FlashTool-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
